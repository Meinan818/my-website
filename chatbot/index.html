<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手 · Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --bg-soft: #f7f7f8;
            --border: #ececec;
            --text: #1f2329;
            --text-dim: #8a8f98;
            --user-bg: #f0f0f3;
            --brand: #10a37f;
            --brand-dark: #0d8a6c;
        }

        body {
            font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶栏：细边框，极简 */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            font-weight: 600;
            position: relative;
        }

        .ai-mark {
            width: 26px; height: 26px;
            border-radius: 7px;
            background: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .topbar .model-tag {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg-soft);
            padding: 3px 9px;
            border-radius: 20px;
        }

        /* 对话区 */
        .chat-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .chat-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* 欢迎区 */
        .welcome {
            text-align: center;
            padding: 40px 0 20px;
        }
        .welcome .big-mark {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: var(--brand);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }
        .welcome h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        .welcome p { color: var(--text-dim); font-size: 0.95rem; }

        .quick-row {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            justify-content: center;
            margin: 22px 0 8px;
        }
        .quick-chip {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 9px 16px;
            font-size: 0.87rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.18s;
        }
        .quick-chip:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: #f2faf7;
        }

        /* 消息行 */
        .msg {
            display: flex;
            gap: 14px;
            margin-bottom: 26px;
            animation: rise 0.3s ease;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-avatar {
            width: 32px; height: 32px;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .msg.bot .msg-avatar { background: var(--brand); color: white; }
        .msg.user .msg-avatar { background: var(--user-bg); color: var(--text); order: 2; }

        .msg-body { flex: 1; min-width: 0; padding-top: 4px; }
        .msg-name { font-size: 0.8rem; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }

        .msg-text {
            font-size: 0.97rem;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg-text.streaming::after {
            content: '▍';
            margin-left: 1px;
            animation: caretBlink 0.9s steps(2, start) infinite;
        }
        @keyframes caretBlink { to { visibility: hidden; } }

        /* 思考过程区块（DeepSeek 风格，灰色小字、可折叠） */
        .think {
            margin: 2px 0 10px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 10px;
            background: rgba(255,255,255,.05);
            overflow: hidden;
        }
        .think-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 11px;
            cursor: pointer;
            user-select: none;
            font-size: 0.8rem;
            color: rgba(220,220,232,.78);
        }
        .think-title { display: inline-flex; align-items: center; gap: 7px; }
        .think-title::before {
            content: '';
            width: 7px; height: 7px; border-radius: 50%;
            background: currentColor;
            animation: thinkPulse 1s ease-in-out infinite;
        }
        .think.collapsed .think-title::before { display: none; }
        @keyframes thinkPulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
        .think-arrow { transition: transform .2s ease; }
        .think.collapsed .think-arrow { transform: rotate(-90deg); }
        .think-body {
            padding: 0 11px 9px;
            font-size: 0.8rem;
            line-height: 1.65;
            color: rgba(205,205,220,.72);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user { flex-direction: row; }
        .msg.user .msg-body { order: 1; }
        .msg.user .msg-text {
            background: var(--user-bg);
            padding: 11px 15px;
            border-radius: 12px;
            display: inline-block;
        }
        .msg.user .msg-body { text-align: right; }

        /* 打字指示 */
        .typing {
            display: inline-flex;
            gap: 5px;
            padding: 6px 0;
        }
        .typing span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #c4c9d0;
            animation: bounce 1.3s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.18s; }
        .typing span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* 底部输入区 */
        .composer-wrap {
            border-top: 1px solid var(--border);
            background: var(--bg);
            padding: 16px 20px 20px;
        }
        .composer {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 18px;
            transition: border-color 0.2s;
        }
        .composer:focus-within { border-color: #c4c9d0; }

        .composer textarea {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            font-size: 0.97rem;
            font-family: inherit;
            line-height: 1.5;
            max-height: 160px;
            padding: 7px 0;
        }

        .send-btn {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: none;
            background: var(--brand);
            color: white;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .send-btn:hover { background: var(--brand-dark); }
        .send-btn:disabled { background: #c4c9d0; cursor: not-allowed; }

        .composer-hint {
            max-width: 760px;
            margin: 8px auto 0;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        @media (max-width: 600px) {
            .welcome h1 { font-size: 1.4rem; }
            .chat-inner { padding: 16px 14px 30px; }
            .composer-wrap { padding: 12px 12px 16px; }
        }
    </style>
    <style>[data-custom-element*="watermark"]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}</style>
</head>
<body>
    <div class="topbar">
        <div class="ai-mark">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        </div>
        <span>AI 智能助手</span>
        <span class="model-tag">Demo</span>
    </div>

    <div class="chat-scroll" id="chatScroll">
        <div class="chat-inner" id="chatInner">
            <div class="welcome" id="welcome">
                <div class="big-mark">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </div>
                <h1>有什么可以帮你？</h1>
                <p>问我问题、聊聊天、让我讲个笑话都可以</p>
                <div class="quick-row">
                    <div class="quick-chip" onclick="sendQuick('你好')">👋 打个招呼</div>
                    <div class="quick-chip" onclick="sendQuick('你会做什么')">你会做什么</div>
                    <div class="quick-chip" onclick="sendQuick('讲个笑话')">讲个笑话</div>
                    <div class="quick-chip" onclick="sendQuick('现在几点了')">现在几点</div>
                    <div class="quick-chip" onclick="sendQuick('学编程怎么入门')">编程入门</div>
                </div>
            </div>
        </div>
    </div>

    <div class="composer-wrap">
        <div class="composer">
            <textarea id="messageInput" rows="1" placeholder="给 AI 助手发送消息..." onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div class="composer-hint">Enter 发送 · Shift + Enter 换行</div>
    </div>

    <script>
        const chatInner = document.getElementById('chatInner');
        const welcome = document.getElementById('welcome');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // 发给真实大模型的对话记录（role / content）
        const chatMessages = [];

        // 调用同域 Pages Function（/api），流式接收：handlers.reason 收到思考片段，handlers.token 收到正式回复片段
        async function streamAI(userText, handlers) {
            chatMessages.push({ role: 'user', content: userText });
            const res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatMessages })
            });

            if (!res.ok || !res.body) {
                const d = await res.json().catch(() => ({}));
                throw new Error(d.error || ('请求失败 ' + res.status));
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let full = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                let sep;
                while ((sep = buffer.indexOf('\n\n')) >= 0) {
                    const evt = buffer.slice(0, sep);
                    buffer = buffer.slice(sep + 2);
                    const line = evt.split('\n').find(l => l.startsWith('data:'));
                    if (!line) continue;
                    const payload = line.slice(5).trim();
                    if (payload === '[DONE]') continue;
                    try {
                        const delta = JSON.parse(payload).choices[0].delta;
                        const rs = delta.reasoning_content;
                        if (rs) handlers.reason(rs);
                        const ct = delta.content;
                        if (ct) { full += ct; handlers.token(ct); }
                    } catch (e) {}
                }
            }

            chatMessages.push({ role: 'assistant', content: full });
            return full;
        }

        function addMessage(text, isUser) {
            if (welcome) welcome.style.display = 'none';
            const msg = document.createElement('div');
            msg.className = `msg ${isUser ? 'user' : 'bot'}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            if (isUser) {
                avatar.textContent = '我';
            } else {
                avatar.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path></svg>';
            }

            const body = document.createElement('div');
            body.className = 'msg-body';
            const name = document.createElement('div');
            name.className = 'msg-name';
            name.textContent = isUser ? '你' : 'AI 助手';
            const textEl = document.createElement('div');
            textEl.className = 'msg-text';
            textEl.textContent = text;
            body.appendChild(name);
            body.appendChild(textEl);

            msg.appendChild(avatar);
            msg.appendChild(body);
            chatInner.appendChild(msg);
            document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
        }

        // 打字机队列：网络到达的文本先入队，再按固定节奏逐字渲染，避免一大片蹦出
        function makeTyper(render) {
            let queue = '';
            let timer = null;
            const tick = () => {
                if (queue.length) {
                    render(queue[0]);
                    queue = queue.slice(1);
                } else {
                    clearInterval(timer);
                    timer = null;
                }
            };
            return {
                feed(text) {
                    queue += text;
                    if (!timer) timer = setInterval(tick, 18);
                },
                flush() {
                    if (queue.length) { render(queue); queue = ''; }
                    if (timer) { clearInterval(timer); timer = null; }
                },
                get isBusy() { return !!timer || queue.length > 0; }
            };
        }

        // 创建带“思考过程”区块的机器人气泡（DeepSeek 风格：上方可折叠思考，下方正式回复）
        function createBotMessage() {
            if (welcome) welcome.style.display = 'none';
            const msg = document.createElement('div');
            msg.className = 'msg bot';

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path></svg>';

            const body = document.createElement('div');
            body.className = 'msg-body';
            const name = document.createElement('div');
            name.className = 'msg-name';
            name.textContent = 'AI 助手';

            const think = document.createElement('div');
            think.className = 'think';
            think.style.display = 'none';
            const thinkHead = document.createElement('div');
            thinkHead.className = 'think-head';
            thinkHead.innerHTML = '<span class="think-title">正在思考</span><svg class="think-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
            const thinkBody = document.createElement('div');
            thinkBody.className = 'think-body';
            think.appendChild(thinkHead);
            think.appendChild(thinkBody);

            const textEl = document.createElement('div');
            textEl.className = 'msg-text';

            body.appendChild(name);
            body.appendChild(think);
            body.appendChild(textEl);
            msg.appendChild(avatar);
            msg.appendChild(body);
            chatInner.appendChild(msg);

            let hasReason = false;
            let collapsed = false;
            let textStarted = false;
            const scrollBox = document.getElementById('chatScroll');

            // 思考、正文各用一个打字机，匀速逐字显示
            const reasonTyper = makeTyper(ch => { thinkBody.textContent += ch; });
            const textTyper = makeTyper(ch => { textEl.textContent += ch; });

            thinkHead.addEventListener('click', () => {
                collapsed = !collapsed;
                thinkBody.style.display = collapsed ? 'none' : 'block';
                think.classList.toggle('collapsed', collapsed);
            });

            return {
                appendReason(piece) {
                    if (!hasReason) { hasReason = true; think.style.display = 'block'; }
                    reasonTyper.feed(piece);
                    scrollBox.scrollTop = scrollBox.scrollHeight;
                },
                finishThink(sec) {
                    reasonTyper.flush(); // 剩余思考立即补全再折叠，不丢内容
                    if (!hasReason) { think.remove(); return; }
                    thinkHead.querySelector('.think-title').textContent = '已深度思考（用时 ' + sec.toFixed(1) + ' 秒）';
                    thinkBody.style.display = 'none';
                    think.classList.add('collapsed');
                    collapsed = true;
                },
                appendText(piece) {
                    if (!textStarted) { textStarted = true; textEl.classList.add('streaming'); }
                    textTyper.feed(piece);
                    scrollBox.scrollTop = scrollBox.scrollHeight;
                },
                finalize() {
                    return new Promise(res => {
                        const check = () => {
                            if (!textTyper.isBusy) { textEl.classList.remove('streaming'); res(); }
                            else setTimeout(check, 30);
                        };
                        check();
                    });
                }
            };
        }

        function showTyping() {
            const msg = document.createElement('div');
            msg.className = 'msg bot';
            msg.id = 'typingMsg';
            msg.innerHTML = `
                <div class="msg-avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path></svg></div>
                <div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>`;
            chatInner.appendChild(msg);
            document.getElementById('chatScroll').scrollTop = document.getElementById('chatScroll').scrollHeight;
        }

        function hideTyping() {
            const t = document.getElementById('typingMsg');
            if (t) t.remove();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || sendBtn.disabled) return;
            addMessage(text, true);
            messageInput.value = '';
            autoGrow(messageInput);
            sendBtn.disabled = true;

            setTimeout(async () => {
                showTyping();
                let bot = null;
                let thinkDone = false;
                const t0 = Date.now();
                const ensureBot = () => {
                    hideTyping();
                    bot = createBotMessage();
                };
                try {
                    const full = await streamAI(text, {
                        reason: (piece) => {
                            if (!bot) ensureBot();
                            bot.appendReason(piece);
                        },
                        token: (piece) => {
                            if (!bot) ensureBot();
                            if (!thinkDone) { bot.finishThink((Date.now() - t0) / 1000); thinkDone = true; }
                            bot.appendText(piece);
                        }
                    });
                    if (!bot) {
                        hideTyping();
                        addMessage(full || '（我张了张嘴，却没说出话来……）', false);
                    } else {
                        if (!thinkDone) bot.finishThink((Date.now() - t0) / 1000);
                        await bot.finalize(); // 等正文逐字吐完，再移除末尾光标
                    }
                } catch (err) {
                    hideTyping();
                    addMessage('不好意思，我刚刚走神了，没接上大脑，等会儿再问我一次？', false);
                } finally {
                    sendBtn.disabled = false;
                    messageInput.focus();
                }
            }, 250);
        }

        function sendQuick(text) {
            messageInput.value = text;
            sendMessage();
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }

        messageInput.focus();
    </script>
</body>
</html>
