<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECTED · 潮流选品店</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='Arial'>S</text></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SELECTED">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function(){}); });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #111111; --gray-900: #2a2a2a; --gray-500: #737373;
            --gray-300: #b8b8b8; --line: #e5e5e5; --bg: #fafafa; --surface: #ffffff;
        }
        body { font-family: -apple-system,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif; background: var(--bg); color: var(--black); line-height: 1.5; -webkit-font-smoothing: antialiased; }
        button { font-family: inherit; }

        /* 登录页 */
        .login-page { min-height: 100vh; display: none; grid-template-columns: 1fr 1fr; }
        .login-page.show { display: grid; }
        .login-visual { background: var(--black); color: white; padding: 60px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .login-visual .brand-mark { font-size: 1.4rem; font-weight: 800; letter-spacing: 4px; }
        .login-visual .big-slogan { font-size: 3.2rem; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
        .login-visual .big-slogan em { font-style: normal; color: var(--gray-300); }
        .login-visual .visual-foot { color: var(--gray-500); font-size: 0.85rem; letter-spacing: 1px; }
        .login-form-side { display: flex; align-items: center; justify-content: center; padding: 40px; background: var(--surface); }
        .login-card { width: 100%; max-width: 360px; }
        .login-card h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        .login-card .sub { color: var(--gray-500); font-size: 0.9rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 1px; color: var(--gray-500); margin-bottom: 8px; }
        .input-wrap { display: flex; gap: 10px; align-items: stretch; }
        .input-wrap .form-input { flex: 1; min-width: 0; }
        .form-input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); background: var(--bg); font-size: 0.95rem; outline: none; transition: border-color .2s; font-family: inherit; }
        .form-input:focus { border-color: var(--black); background: white; }
        .code-btn { padding: 0 16px; background: var(--black); color: white; border: 1px solid var(--black); cursor: pointer; white-space: nowrap; flex-shrink: 0; font-size: 0.82rem; }
        .code-btn:disabled { background: var(--gray-300); border-color: var(--gray-300); cursor: not-allowed; }
        .submit-btn { width: 100%; padding: 15px; background: var(--black); color: white; border: none; font-size: 0.95rem; font-weight: 700; letter-spacing: 2px; cursor: pointer; margin-top: 10px; transition: background .2s; }
        .submit-btn:hover { background: var(--gray-900); }
        .login-footer { margin-top: 18px; color: var(--gray-500); font-size: 0.78rem; text-align: center; }
        .auth-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
        .auth-tab { background: none; border: none; padding: 10px 2px; font-size: 0.92rem; font-weight: 600; color: var(--gray-500); cursor: pointer; position: relative; }
        .auth-tab.active { color: var(--black); }
        .auth-tab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--black); }
        .code-alert { position: fixed; top:50%; left:50%; transform: translate(-50%,-50%); background:white; border:1px solid var(--line); padding:36px 40px; z-index:1000; text-align:center; opacity:0; visibility:hidden; transition:all .3s; max-width:340px; width:90%; }
        .code-alert.show { opacity:1; visibility:visible; }
        .code-alert .phone-icon { font-size:2.4rem; margin-bottom:12px; }
        .code-alert h3 { font-size:1.1rem; margin-bottom:4px; }
        .code-alert .code-number { font-size:2.4rem; font-weight:800; letter-spacing:8px; margin:14px 0; font-family:'Courier New',monospace; }
        .code-alert p { color:var(--gray-500); font-size:.82rem; }
        .code-alert .close-alert { margin-top:20px; padding:10px 32px; background:var(--black); color:white; border:none; cursor:pointer; font-weight:600; }

        /* 商城 */
        .shop-page { display: none; }
        .shop-page.show { display: block; }
        .top-nav { background:var(--surface); border-bottom:1px solid var(--line); padding:0 28px; height:64px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
        .shop-logo { font-weight:800; font-size:1.25rem; letter-spacing:3px; }
        .top-nav-right { display:flex; align-items:center; gap:14px; }
        .user-info { display:flex; align-items:center; gap:9px; }
        .user-avatar { width:32px; height:32px; background:var(--black); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; }
        .user-mail { font-size:.85rem; color:var(--gray-500); }
        .admin-badge { background:var(--black); color:white; font-size:.68rem; padding:3px 8px; letter-spacing:1px; }
        .logout-btn { background:none; border:1px solid var(--line); padding:7px 14px; color:var(--gray-500); cursor:pointer; font-size:.8rem; }
        .logout-btn:hover { border-color:var(--black); color:var(--black); }
        .add-prod-btn { background:var(--black); color:white; border:none; padding:9px 16px; cursor:pointer; font-size:.82rem; font-weight:600; }
        .cart-btn { background:var(--black); border:none; padding:9px 18px; color:white; font-weight:600; cursor:pointer; position:relative; font-size:.85rem; letter-spacing:1px; }
        .cart-badge { position:absolute; top:-7px; right:-7px; background:white; color:var(--black); border:1px solid var(--black); font-size:.68rem; font-weight:700; min-width:19px; height:19px; border-radius:10px; display:none; align-items:center; justify-content:center; padding:0 5px; }
        .container { max-width:1240px; margin:0 auto; padding:32px 28px; }
        .hero-banner { border:1px solid var(--black); background:var(--black); color:white; padding:36px 40px; margin-bottom:32px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .hero-banner h1 { font-size:1.5rem; font-weight:800; }
        .hero-banner p { color:var(--gray-300); font-size:.88rem; margin-top:6px; }
        .hero-banner .hero-tag { border:1px solid var(--gray-500); padding:8px 18px; font-size:.82rem; letter-spacing:1px; }
        .categories { display:flex; gap:28px; margin-bottom:28px; border-bottom:1px solid var(--line); overflow-x:auto; }
        .cat-btn { padding:10px 2px; background:none; border:none; color:var(--gray-500); font-weight:600; font-size:.95rem; cursor:pointer; white-space:nowrap; position:relative; }
        .cat-btn.active { color:var(--black); }
        .cat-btn.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--black); }
        .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); transition:opacity .16s ease; }
        .product-card { background:var(--surface); transition:background .2s; position:relative; }
        .product-card:hover { background:#fcfcfc; }
        @keyframes cardIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .product-card.card-in { animation:cardIn .42s cubic-bezier(.22,.61,.36,1) both; }
        .product-img { height:200px; display:flex; align-items:center; justify-content:center; font-size:3.2rem; background:#f0f0f0; }
        .product-body { padding:16px; }
        .product-name { font-weight:700; font-size:.98rem; margin-bottom:4px; }
        .product-desc { color:var(--gray-500); font-size:.8rem; margin-bottom:14px; min-height:1.2em; }
        .product-foot { display:flex; justify-content:space-between; align-items:center; }
        .price { font-weight:800; font-size:1.1rem; }
        .add-btn { background:none; border:1px solid var(--black); color:var(--black); padding:7px 14px; cursor:pointer; font-weight:600; font-size:.78rem; }
        .add-btn:hover { background:var(--black); color:white; }
        .admin-ops { display:flex; gap:6px; margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; }
        .op-btn { flex:1; background:none; border:1px solid var(--line); padding:6px; font-size:.75rem; cursor:pointer; color:var(--gray-500); }
        .op-btn:hover { border-color:var(--black); color:var(--black); }
        .op-btn.danger:hover { border-color:#e11; color:#e11; }

        /* 购物车 */
        .cart-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; opacity:0; visibility:hidden; transition:all .3s; }
        .cart-overlay.show { opacity:1; visibility:visible; }
        .cart-sidebar { position:fixed; top:0; right:0; width:360px; max-width:90vw; height:100vh; background:white; z-index:201; transform:translateX(100%); transition:transform .3s; display:flex; flex-direction:column; }
        .cart-sidebar.show { transform:translateX(0); }
        .cart-head { padding:22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
        .close-x { background:none; border:none; font-size:1.2rem; cursor:pointer; }
        .cart-list { flex:1; overflow-y:auto; padding:8px 22px; }
        .empty-cart { text-align:center; color:var(--gray-300); margin-top:60px; }
        .cart-item { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); }
        .ci-name { font-weight:600; font-size:.9rem; } .ci-price { color:var(--gray-500); font-size:.85rem; margin-top:3px; }
        .qty-box { display:flex; align-items:center; gap:4px; }
        .qty-btn { width:28px; height:28px; border:1px solid var(--line); background:white; cursor:pointer; }
        .qty-box span { width:24px; text-align:center; }
        .cart-foot { padding:22px; border-top:1px solid var(--line); }
        .total-row { display:flex; justify-content:space-between; margin-bottom:14px; font-weight:600; }
        .total-price { font-weight:800; font-size:1.3rem; }
        .checkout-btn { width:100%; padding:15px; background:var(--black); color:white; border:none; font-weight:700; cursor:pointer; }

        /* 编辑商品弹窗 */
        .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:400; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-mask.show { display:flex; }
        .modal { background:white; width:100%; max-width:420px; max-height:90vh; overflow-y:auto; padding:28px; }
        .modal h3 { font-size:1.1rem; font-weight:800; margin-bottom:18px; }
        .modal .row { margin-bottom:14px; }
        .modal .row label { display:block; font-size:.75rem; color:var(--gray-500); margin-bottom:6px; font-weight:600; }
        .modal-actions { display:flex; gap:10px; margin-top:20px; }
        .modal-actions button { flex:1; padding:12px; cursor:pointer; font-weight:700; letter-spacing:1px; }
        .btn-primary { background:var(--black); color:white; border:none; }
        .btn-ghost { background:white; border:1px solid var(--line); color:var(--black); }

        .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--black); color:white; padding:13px 26px; z-index:500; transition:transform .3s; font-size:.88rem; }
        .toast.show { transform:translateX(-50%) translateY(0); }

        @media (max-width:820px) { .login-page.show { grid-template-columns:1fr; } .login-visual { display:none; } .user-mail { display:none; } }
        @media (max-width:768px) {
            .top-nav { padding:0 10px; height:54px; gap:6px; }
            .top-nav-right { gap:6px; flex-wrap:nowrap; }
            .shop-logo { font-size:1rem; letter-spacing:1px; white-space:nowrap; }
            .add-prod-btn { padding:8px 9px; font-size:.72rem; white-space:nowrap; }
            .cart-btn { padding:8px 10px; font-size:.72rem; letter-spacing:0; white-space:nowrap; }
            .logout-btn { padding:7px 9px; font-size:.72rem; white-space:nowrap; }
            .admin-badge { padding:2px 5px; font-size:.6rem; }
            .user-avatar { width:28px; height:28px; font-size:.72rem; }
            .container { padding:16px 10px; }
            .products-grid { grid-template-columns:repeat(2,1fr); }
            .product-img { height:130px; font-size:2.4rem; }
            .hero-banner { padding:20px; } .hero-banner h1 { font-size:1.15rem; }
        }
    </style>
    <style>[data-custom-element*="watermark"]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}</style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-page show" id="loginPage">
        <div class="login-visual">
            <div class="brand-mark">SELECTED</div>
            <div class="big-slogan">LESS,<br>BUT <em>BETTER.</em></div>
            <div class="visual-foot">CURATED GOODS / 2026 COLLECTION</div>
        </div>
        <div class="login-form-side">
            <div class="login-card">
                <h1>登录账户</h1>
                <p class="sub">云端账号登录，商品实时同步</p>
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchAuth('email', this)">邮箱密码</button>
                    <button class="auth-tab" onclick="switchAuth('sms', this)">手机验证码</button>
                </div>

                <!-- 邮箱密码（云端） -->
                <div id="panelEmail">
                    <div class="form-group"><label>邮箱</label><input type="email" class="form-input" id="emailInput" placeholder="you@example.com" autocomplete="email"></div>
                    <div class="form-group"><label>密码</label><input type="password" class="form-input" id="pwdInput" placeholder="密码（至少 6 位）" autocomplete="current-password"></div>
                    <button class="submit-btn" onclick="doEmailAuth()">登录 / 注册</button>
                    <p class="login-footer">新邮箱首次登录将自动注册账号</p>
                </div>

                <!-- 手机验证码（本地游客） -->
                <div id="panelSms" style="display:none;">
                    <div class="form-group"><label>手机号</label><input type="tel" class="form-input" id="phoneInput" placeholder="请输入手机号" maxlength="11"></div>
                    <div class="form-group"><label>验证码</label>
                        <div class="input-wrap">
                            <input type="text" class="form-input" id="codeInput" placeholder="6位验证码" maxlength="6">
                            <button class="code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                        </div>
                    </div>
                    <button class="submit-btn" onclick="doSmsLogin()">进入商城</button>
                    <p class="login-footer">手机验证码为本地演示，不与云端账号互通</p>
                </div>
            </div>
        </div>
    </div>

    <div class="code-alert" id="codeAlert">
        <div class="phone-icon">◻</div>
        <h3>验证码已发送</h3>
        <p>您的验证码是</p>
        <div class="code-number" id="codeNumber">000000</div>
        <p>5分钟内有效</p>
        <button class="close-alert" onclick="closeAlert()">我知道了</button>
    </div>

    <!-- 商城 -->
    <div class="shop-page" id="shopPage">
        <div class="top-nav">
            <div class="shop-logo">SELECTED</div>
            <div class="top-nav-right">
                <span class="admin-badge" id="adminBadge" style="display:none;">ADMIN</span>
                <button class="add-prod-btn" id="addProdBtn" style="display:none;" onclick="openProductModal()">＋ 添加商品</button>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="user-mail" id="userMail">--</span>
                </div>
                <button class="logout-btn" onclick="logout()">退出</button>
                <button class="cart-btn" onclick="toggleCart()">购物车<span class="cart-badge" id="cartBadge">0</span></button>
            </div>
        </div>
        <div class="container">
            <div class="hero-banner">
                <div><h1>新季首单立减 ¥20</h1><p>满99包邮 · 7天无理由 · 正品保障</p></div>
                <div class="hero-tag">NEW SEASON</div>
            </div>
            <div class="categories" id="catBar">
                <button class="cat-btn active" onclick="filterCat('all', this)">全部</button>
            </div>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </div>

    <!-- 购物车 -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-head"><h3>购物车</h3><button class="close-x" onclick="toggleCart()">✕</button></div>
        <div class="cart-list" id="cartList"><p class="empty-cart">购物车空空如也</p></div>
        <div class="cart-foot">
            <div class="total-row"><span>合计</span><span class="total-price" id="cartTotal">¥0</span></div>
            <button class="checkout-btn" onclick="checkout()">去 结 算</button>
        </div>
    </div>

    <!-- 商品编辑弹窗 -->
    <div class="modal-mask" id="prodModal">
        <div class="modal">
            <h3 id="modalTitle">添加商品</h3>
            <div class="row"><label>商品名称</label><input class="form-input" id="pName" placeholder="如：降噪耳机 Pro"></div>
            <div class="row"><label>价格（元）</label><input class="form-input" id="pPrice" type="number" placeholder="299"></div>
            <div class="row"><label>分类</label>
                <select class="form-input" id="pCat">
                    <option value="digital">数码潮玩</option>
                    <option value="fashion">潮流穿搭</option>
                    <option value="daily">家居日用</option>
                    <option value="food">零食饮品</option>
                </select>
            </div>
            <div class="row"><label>图标（一个 emoji）</label><input class="form-input" id="pIcon" placeholder="🎧" maxlength="4"></div>
            <div class="row"><label>描述</label><input class="form-input" id="pDesc" placeholder="一句话描述"></div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="closeProductModal()">取消</button>
                <button class="btn-primary" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== Supabase 配置 =====
        const SUPA_URL = 'https://bxvbmgqjbfyesufanqch.supabase.co';
        const SUPA_KEY = 'sb_publishable_aJmQ3SOpTCpZwGH084ev7Q_dQZrAhvn';
        const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

        const CATS = { digital:'数码潮玩', fashion:'潮流穿搭', daily:'家居日用', food:'零食饮品' };
        let products = [];
        let isAdmin = false;
        let currentUser = null;
        let cart = [];
        let currentCat = 'all';
        let editingId = null;

        // 本地手机验证码
        let currentCode = '', countdownTimer = null;
        function sendCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的手机号'); return; }
            currentCode = String(Math.floor(100000 + Math.random()*900000));
            document.getElementById('codeNumber').textContent = currentCode;
            setTimeout(() => document.getElementById('codeAlert').classList.add('show'), 300);
            const btn = document.getElementById('sendCodeBtn');
            let sec = 60; btn.disabled = true; btn.textContent = sec+'s 后重发';
            countdownTimer = setInterval(() => {
                sec--; btn.textContent = sec+'s 后重发';
                if (sec <= 0) { clearInterval(countdownTimer); btn.disabled = false; btn.textContent = '获取验证码'; }
            }, 1000);
        }
        function closeAlert() { document.getElementById('codeAlert').classList.remove('show'); }

        function switchAuth(type, btn) {
            document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panelEmail').style.display = type === 'email' ? 'block' : 'none';
            document.getElementById('panelSms').style.display  = type === 'sms'   ? 'block' : 'none';
        }

        // 登录/注册成功后进入商城（查角色）
        async function afterAuth(session) {
            const user = session.user;
            let admin = false;
            const { data: p } = await sb.from('user_profiles').select('role').eq('id', user.id).single();
            if (p && p.role === 'admin') admin = true;
            await enterShop({ email: user.email, isAdmin: admin, avatar: user.email[0], isEmail: true });
        }

        // 邮箱注册/登录
        async function doEmailAuth() {
            const email = document.getElementById('emailInput').value.trim();
            const pwd = document.getElementById('pwdInput').value;
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showToast('请输入正确的邮箱'); return; }
            if (pwd.length < 6) { showToast('密码至少 6 位'); return; }
            let { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
            if (error) {
                const sign = await sb.auth.signUp({ email, password: pwd });
                if (sign.error) { showToast(sign.error.message); return; }
                if (!sign.data.session) { showToast('注册成功！若开了邮箱验证，请先去邮箱点确认链接'); return; }
                showToast('注册成功，欢迎光临');
                await afterAuth(sign.data.session);
            } else {
                showToast('登录成功，欢迎回来');
                await afterAuth(data.session);
            }
        }

        // 手机验证码本地游客
        function doSmsLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();
            if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的手机号'); return; }
            if (code !== currentCode) { showToast('验证码错误'); return; }
            enterShop({ email: phone.slice(0,3)+'****'+phone.slice(-4), isAdmin: false, avatar: phone.slice(-2) });
        }

        async function enterShop(user) {
            currentUser = user; isAdmin = !!user.isAdmin;
            document.getElementById('loginPage').classList.remove('show');
            document.getElementById('shopPage').classList.add('show');
            document.getElementById('userMail').textContent = user.email;
            document.getElementById('userAvatar').textContent = (user.avatar || user.email[0] || 'U').toUpperCase();
            document.getElementById('adminBadge').style.display = isAdmin ? 'inline-block' : 'none';
            document.getElementById('addProdBtn').style.display = isAdmin ? 'inline-block' : 'none';
            await loadProducts();
        }

        async function logout() {
            if (currentUser && currentUser.isEmail) { await sb.auth.signOut(); }
            currentUser = null; isAdmin = false;
            document.getElementById('shopPage').classList.remove('show');
            document.getElementById('loginPage').classList.add('show');
            document.getElementById('pwdInput').value = '';
            showToast('已退出登录');
        }

        // 商品：从云端加载
        async function loadProducts() {
            const { data, error } = await sb.from('products').select('*').order('id');
            if (error) { showToast('商品加载失败：' + error.message); return; }
            products = data || [];
            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            const bar = document.getElementById('catBar');
            const used = [...new Set(products.map(p => p.category))];
            bar.innerHTML = '<button class="cat-btn '+(currentCat==='all'?'active':'')+'" onclick="filterCat(\'all\', this)">全部</button>' +
                used.map(c => `<button class="cat-btn ${currentCat===c?'active':''}" onclick="filterCat('${c}', this)">${CATS[c]||c}</button>`).join('');
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const list = products.filter(p => currentCat === 'all' || p.category === currentCat);
            grid.innerHTML = list.map((p, i) => `
                <div class="product-card card-in" style="animation-delay:${i*45}ms">
                    <div class="product-img">${p.cover_img || '📦'}</div>
                    <div class="product-body">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.description || ''}</div>
                        <div class="product-foot">
                            <span class="price">¥${p.price}</span>
                            <button class="add-btn" onclick="addCart('${String(p.name).replace(/'/g,"\\'")}', ${p.price})">加入</button>
                        </div>
                        ${isAdmin ? `
                        <div class="admin-ops">
                            <button class="op-btn" onclick="openProductModal(${p.id})">✎ 编辑</button>
                            <button class="op-btn danger" onclick="deleteProduct(${p.id})">🗑 删除</button>
                        </div>` : ''}
                    </div>
                </div>`).join('');
        }

        function filterCat(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const grid = document.getElementById('productsGrid');
            grid.style.opacity = '0';
            setTimeout(() => { renderProducts(); grid.style.opacity = '1'; }, 160);
        }

        // 商品增删改
        function openProductModal(id) {
            editingId = id || null;
            document.getElementById('modalTitle').textContent = id ? '编辑商品' : '添加商品';
            if (id) {
                const p = products.find(x => x.id === id);
                document.getElementById('pName').value = p.name;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pCat').value = p.category;
                document.getElementById('pIcon').value = p.cover_img || '';
                document.getElementById('pDesc').value = p.description || '';
            } else {
                ['pName','pPrice','pIcon','pDesc'].forEach(k => document.getElementById(k).value = '');
            }
            document.getElementById('prodModal').classList.add('show');
        }
        function closeProductModal() { document.getElementById('prodModal').classList.remove('show'); }

        async function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            const price = parseFloat(document.getElementById('pPrice').value);
            const category = document.getElementById('pCat').value;
            const cover_img = document.getElementById('pIcon').value.trim() || '📦';
            const desc = document.getElementById('pDesc').value.trim();
            if (!name || isNaN(price)) { showToast('请填商品名和价格'); return; }
            if (editingId) {
                const { error } = await sb.from('products').update({ name, price, category, cover_img, description: desc }).eq('id', editingId);
                if (error) { showToast('更新失败：' + error.message); return; }
                showToast('已更新');
            } else {
                const { error } = await sb.from('products').insert({ name, price, category, cover_img, description: desc });
                if (error) { showToast('添加失败：' + error.message); return; }
                showToast('已添加');
            }
            closeProductModal();
            await loadProducts();
        }

        async function deleteProduct(id) {
            if (!confirm('确定删除这个商品？')) return;
            const { error } = await sb.from('products').delete().eq('id', id);
            if (error) { showToast('删除失败：' + error.message); return; }
            showToast('已删除');
            await loadProducts();
        }

        // 购物车
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('show');
            document.getElementById('cartOverlay').classList.toggle('show');
        }
        function addCart(name, price) {
            const exist = cart.find(i => i.name === name);
            if (exist) exist.qty++; else cart.push({ name, price, qty: 1 });
            updateCart();
            showToast('已加入：' + name);
        }
        function changeQty(name, delta) {
            const item = cart.find(i => i.name === name);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
            updateCart();
        }
        function updateCart() {
            const list = document.getElementById('cartList');
            const badge = document.getElementById('cartBadge');
            const count = cart.reduce((s,i)=>s+i.qty,0);
            badge.style.display = count>0 ? 'flex' : 'none'; badge.textContent = count;
            if (!cart.length) { list.innerHTML = '<p class="empty-cart">购物车空空如也</p>'; }
            else {
                list.innerHTML = cart.map(i => `<div class="cart-item"><div><div class="ci-name">${i.name}</div><div class="ci-price">¥${i.price}</div></div>
                    <div class="qty-box"><button class="qty-btn" onclick="changeQty('${String(i.name).replace(/'/g,"\\'")}',-1)">−</button><span>${i.qty}</span><button class="qty-btn" onclick="changeQty('${String(i.name).replace(/'/g,"\\'")}',1)">＋</button></div></div>`).join('');
            }
            document.getElementById('cartTotal').textContent = '¥' + cart.reduce((s,i)=>s+i.price*i.qty,0);
        }
        function checkout() {
            if (!cart.length) { showToast('购物车是空的'); return; }
            showToast('下单成功！共¥' + cart.reduce((s,i)=>s+i.price*i.qty,0));
            cart = []; updateCart(); toggleCart();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        // 启动：恢复云端会话
        (async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (session && session.user) {
                const email = session.user.email;
                let admin = false;
                const { data: p } = await sb.from('user_profiles').select('role').eq('id', session.user.id).single();
                if (p && p.role === 'admin') admin = true;
                await enterShop({ email, isAdmin: admin, avatar: email[0], isEmail: true });
            }
        })();
    </script>
</body>
</html>
